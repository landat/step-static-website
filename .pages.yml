                type: color
                default: "#0b0b0d"
                description: "Нажмите на цвет для выбора. Можно ввести код, например #FFFFFF."
  - name: photos
    label: 4. Фото и видео
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: photos
        label: Галерея фото и видео
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - name: published
            label: Показывать на сайте
            type: boolean
            default: true
          - name: src
            label: Фото или видео
            type: file
            required: true
            options:
              media: photos
              categories:
                - image
                - video
          - name: alt
            label: Подпись и краткое описание
            type: string
            required: true
            options:
              maxlength: 160
            description: Несколько слов о фото или видео. Подпись отображается в галерее.
  - name: contact
    label: 5. Контакты
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: contact
        label: Контактная информация
        type: object
        fields:
          - name: address
            label: Полный адрес
            type: text
            required: true
            options:
              maxlength: 300
          - name: phone
            label: Телефон
            type: string
            required: true
            description: В формате +7 495 123-45-67
            pattern:
              regex: ^\+?[0-9 ()-]{10,24}$
              message: Проверьте номер телефона. Разрешены цифры, пробелы, скобки, + и дефисы.
          - name: email
            label: Email
            type: string
            required: true
            pattern:
              regex: ^[^@\s]+@[^@\s]+\.[^@\s]+$
              message: Введите email в формате name@example.ru.
          - name: directions
            label: Как добраться
            type: text
            required: true
            description: Абзацы разделяйте пустой строкой.
          - name: mapUrl
            label: Ссылка для карты
            type: string
            required: true
            description: Ссылка из атрибута src виджета Яндекс.Карт. Обычно её меняет разработчик.
            pattern:
              regex: ^https://yandex\.ru/map-widget/.*$
              message: Нужна ссылка виджета https://yandex.ru/map-widget/...
  - name: prices

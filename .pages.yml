media:
  - name: photos
    label: Фото и видео
    input: assets/photos
    output: assets/photos
    rename: safe
    extensions: [jpg, jpeg, png, webp, mp4, webm]
    actions:
      - name: optimize_photos
        label: Уменьшить большие фотографии
        workflow: optimize-images.yml
        ref: current
        cancelable: false
        confirm:
          title: Оптимизировать фотографии?
          message: Большие изображения будут уменьшены без изменения их адресов на сайте.
          button: Запустить
  - name: videos
    label: Видео MP4
    input: assets/videos
    output: assets/videos
    rename: safe
    categories: [video]
    extensions: [mp4, webm]
  - name: materials
    label: Файлы для учеников
    input: assets/materials
    output: assets/materials
    rename: safe
    categories: [document]
    extensions: [pdf, doc, docx]

settings:
  hide: true
  content:
    merge: true
  commit:
    identity: user
    templates:
      update: "Обновление сайта через CMS: {name}"

content:
  - name: announcement
    label: 1. Срочное объявление
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: announcement
        label: Объявление на главной странице
        type: object
        fields:
          - { name: enabled, label: Показывать объявление, type: boolean, default: true }
          - { name: title, label: Заголовок, type: string, required: true, options: { maxlength: 80 } }
          - { name: intro, label: Текст объявления, type: text, required: true, options: { maxlength: 500 } }
          - { name: scheduleTitle, label: Подпись перед расписанием, type: string, required: true, options: { maxlength: 120 } }
          - { name: directionsLabel, label: Текст ссылки на схему, type: string, required: true, options: { maxlength: 60 } }

  - name: schedule
    label: 2. Расписание и группы
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: schedule
        label: Расписание
        type: object
        fields:
          - { name: intro, label: Краткий текст над расписанием, type: text, required: true, options: { maxlength: 240 } }
          - name: groups
            label: Группы
            type: object
            list:
              min: 1
              collapsible:
                collapsed: false
                summary: "{name}"
            fields:
              - { name: name, label: Название группы, type: string, required: true, options: { maxlength: 80 } }
              - { name: description, label: Для кого эта группа, type: text, required: true, options: { maxlength: 400 } }
              - name: sessions
                label: Дни и время занятий
                type: object
                list:
                  min: 1
                  collapsible:
                    collapsed: false
                    summary: "{day} — {time}"
                fields:
                  - name: day
                    label: День недели
                    type: select
                    required: true
                    options:
                      values:
                        - { name: monday, label: Понедельник }
                        - { name: tuesday, label: Вторник }
                        - { name: wednesday, label: Среда }
                        - { name: thursday, label: Четверг }
                        - { name: friday, label: Пятница }
                        - { name: saturday, label: Суббота }
                        - { name: sunday, label: Воскресенье }
                  - { name: time, label: Время, type: string, required: true, description: "Например: 19:00–20:30" }

  - name: news
    label: 3. Новости
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: news
        label: Новости на главной странице
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{date} — {title}"
        fields:
          - { name: published, label: Показывать на сайте, type: boolean, default: true }
          - { name: pinned, label: Закрепить первой, type: boolean, default: false }
          - { name: date, label: Дата, type: date, required: true, options: { format: yyyy-MM-dd } }
          - { name: title, label: Заголовок, type: string, required: true, options: { maxlength: 120 } }
          - { name: text, label: Текст новости, type: text, required: true, options: { maxlength: 1000 } }
          - name: image
            label: Фото или видео к новости
            type: file
            options:
              media: photos
              categories: [image, video]
          - { name: url, label: Ссылка «Подробнее», type: string, description: "Можно вставить https://... или адрес страницы сайта, например photos.html" }
          - { name: linkLabel, label: Текст ссылки, type: string, default: "Подробнее", options: { maxlength: 60 } }

  - name: photos
    label: 4. Фото и видео
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: photos
        label: Галерея фото и видео
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - { name: published, label: Показывать на сайте, type: boolean, default: true }
          - name: src
            label: Фото или видео
            type: file
            required: true
            options:
              media: photos
              categories: [image, video]
          - { name: alt, label: Подпись и краткое описание, type: string, required: true, options: { maxlength: 160 }, description: "Несколько слов о фото или видео. Подпись отображается в галерее." }

  - name: contact
    label: 5. Контакты
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: contact
        label: Контактная информация
        type: object
        fields:
          - { name: address, label: Полный адрес, type: text, required: true, options: { maxlength: 300 } }
          - name: phone
            label: Телефон
            type: string
            required: true
            description: "В формате +7 495 123-45-67"
            pattern:
              regex: "^\\+?[0-9 ()-]{10,24}$"
              message: "Проверьте номер телефона. Разрешены цифры, пробелы, скобки, + и дефисы."
          - name: email
            label: Email
            type: string
            required: true
            pattern:
              regex: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
              message: "Введите email в формате name@example.ru."
          - { name: directions, label: Как добраться, type: text, required: true, description: "Абзацы разделяйте пустой строкой." }
          - name: mapUrl
            label: Ссылка для карты
            type: string
            required: true
            description: "Ссылка из атрибута src виджета Яндекс.Карт. Обычно её меняет разработчик."
            pattern:
              regex: "^https://yandex\\.ru/map-widget/.*$"
              message: "Нужна ссылка виджета https://yandex.ru/map-widget/..."

  - name: prices
    label: 6. Цены
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: prices
        label: Стоимость и запись на главной странице
        type: object
        fields:
          - { name: intro, label: Вводный текст, type: text, required: true, options: { maxlength: 300 } }
          - name: items
            label: Варианты занятий
            type: object
            list:
              min: 1
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: Название, type: string, required: true, options: { maxlength: 100 } }
              - { name: text, label: Описание или стоимость, type: text, required: true, options: { maxlength: 400 } }
          - { name: explanationTitle, label: Заголовок пояснения, type: string, required: true, options: { maxlength: 120 } }
          - { name: explanation, label: Пояснение, type: text, required: true, description: "Коротко поясните, как узнать стоимость и записаться. Абзацы разделяйте пустой строкой." }
          - { name: buttonLabel, label: Текст кнопки, type: string, required: true, options: { maxlength: 60 } }

  - name: videos
    label: 7. Видео для новичков
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: videos
        label: Видеоуроки
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: published, label: Показывать на сайте, type: boolean, default: true }
          - { name: title, label: Название урока, type: string, required: true, options: { maxlength: 140 } }
          - { name: description, label: Краткое описание, type: text, options: { maxlength: 500 } }
          - name: kind
            label: Где находится видео
            type: select
            required: true
            default: mp4
            options:
              values:
                - { name: mp4, label: Загруженный MP4/WebM }
                - { name: rutube, label: Rutube }
          - name: src
            label: Файл MP4/WebM
            type: file
            description: "Заполните для типа «Загруженный MP4/WebM»."
            options:
              media: videos
              categories: [video]
          - name: rutubeUrl
            label: Ссылка на Rutube
            type: string
            description: "Заполните для типа «Rutube»: вставьте обычную ссылку на ролик."
            pattern:
              regex: "^(https://(?:www\\.)?rutube\\.ru/(?:video|shorts|play/embed)/[^/?#]+[/?#]?.*|)$"
              message: "Вставьте ссылку на видео с rutube.ru."

  - name: beginner_materials
    label: 8. Материалы для новичков
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: beginnerMaterials
        label: Статьи и файлы
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: published, label: Показывать на сайте, type: boolean, default: true }
          - { name: title, label: Заголовок, type: string, required: true, options: { maxlength: 140 } }
          - { name: text, label: Текст материала, type: text, required: true, description: "Абзацы разделяйте пустой строкой." }
          - name: url
            label: Файл для скачивания
            type: file
            options:
              media: materials
              categories: [document]
          - { name: linkText, label: Текст кнопки, type: string, default: "Открыть материал", options: { maxlength: 60 } }

  - name: about
    label: 9. О нас
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: about
        label: Страница «О нас»
        type: object
        fields:
          - { name: title, label: Заголовок, type: string, required: true, options: { maxlength: 100 } }
          - { name: text, label: Основной текст, type: text, required: true, options: { maxlength: 3000 }, description: "Абзацы разделяйте пустой строкой. Возраст приёма — с 11 лет." }
          - name: image
            label: Фото или видео
            type: file
            description: "Выберите фото (JPG, PNG, WebP) или видео (MP4, WebM), до 50 МиБ. Видео запускается по нажатию. Чтобы скрыть медиа, очистите поле."
            options:
              media: photos
              categories: [image, video]
          - { name: imageAlt, label: Описание фото или видео, type: string, options: { maxlength: 160 } }

  - name: home
    label: 10. Главная
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: home
        label: Изображения главной страницы
        type: object
        fields:
          - name: heroImage
            label: Фото или видео первого экрана
            type: file
            description: "Горизонтальное фото или видео MP4/WebM, до 50 МиБ. Фон заполняет экран; края могут обрезаться. Видео запускается кнопкой без звука. Пустое поле возвращает исходное фото."
            options:
              media: photos
              categories: [image, video]
          - name: directionsImage
            label: Фото или видео блока «Основные направления»
            type: file
            description: "Фото или видео MP4/WebM, до 50 МиБ, рядом с карточками направлений. Видео запускается по нажатию. Выберите файл и сохраните. Пустое поле возвращает исходный снимок. Этот блок не связан с галереей."
            options:
              media: photos
              categories: [image, video]

  - name: articles
    label: 12. Статьи
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: articles
        label: Статьи
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: published
            label: Показывать на сайте
            type: boolean
            default: true
          - name: archived
            label: Материал из архива
            type: boolean
            default: false
            description: Показывает примечание о времени первоначальной публикации. Для новых статей выключите.
          - name: slug
            label: Адрес статьи (латиницей)
            type: string
            required: true
            description: "Уникальный постоянный адрес: например kak-vybrat-klub. После публикации не меняйте его — на статью могут вести старые ссылки."
            pattern:
              regex: ^[a-z0-9]+(?:-[a-z0-9]+)*$
              message: Используйте строчные латинские буквы, цифры и дефисы.
          - name: title
            label: Заголовок статьи (H1)
            type: string
            required: true
            options:
              maxlength: 200
          - name: date
            label: Дата первоначальной публикации
            type: date
            required: true
          - name: seoTitle
            label: "SEO: title"
            type: string
            required: false
            options:
              maxlength: 200
          - name: description
            label: Краткое описание и SEO description
            type: text
            required: true
            options:
              maxlength: 500
          - name: text
            label: Текст статьи
            type: text
            required: true
            description: Обычный текст, без HTML. Абзацы разделяйте пустой строкой.

media:
  - name: photos
    label: Фото и видео
    input: assets/photos
    output: assets/photos
    rename: safe
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - mp4
      - webm
    actions:
      - name: optimize_photos
        label: Уменьшить большие фотографии
        workflow: optimize-images.yml
        ref: current
        cancelable: false
        confirm:
          title: Оптимизировать фотографии?
          message: Большие изображения будут уменьшены без изменения их адресов на сайте.
          button: Запустить
  - name: videos
    label: Видео MP4
    input: assets/videos
    output: assets/videos
    rename: safe
    categories:
      - video
    extensions:
      - mp4
      - webm
  - name: materials
    label: Файлы для учеников
    input: assets/materials
    output: assets/materials
    rename: safe
    categories:
      - document
    extensions:
      - pdf
      - doc
      - docx
settings:
  hide: true
  content:
    merge: true
  commit:
    identity: user
    templates:
      update: "Обновление сайта через CMS: {name}"
content:
  - name: announcement
    label: 1. Срочное объявление
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: announcement
        label: Объявление на главной странице
        type: object
        fields:
          - name: enabled
            label: Показывать объявление
            type: boolean
            default: true
          - name: title
            label: Заголовок
            type: string
            required: true
            options:
              maxlength: 80
          - name: intro
            label: Текст объявления
            type: text
            required: true
            options:
              maxlength: 500
          - name: scheduleTitle
            label: Подпись перед расписанием
            type: string
            required: true
            options:
              maxlength: 120
          - name: directionsLabel
            label: Текст ссылки на схему
            type: string
            required: true
            options:
              maxlength: 60
  - name: schedule
    label: 2. Расписание и группы
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: schedule
        label: Расписание
        type: object
        fields:
          - name: intro
            label: Краткий текст над расписанием
            type: text
            required: true
            options:
              maxlength: 240
          - name: groups
            label: Группы
            type: object
            list:
              min: 1
              collapsible:
                collapsed: false
                summary: "{name}"
            fields:
              - name: name
                label: Название группы
                type: string
                required: true
                options:
                  maxlength: 80
              - name: description
                label: Для кого эта группа
                type: text
                required: true
                options:
                  maxlength: 400
              - name: sessions
                label: Дни и время занятий
                type: object
                list:
                  min: 1
                  collapsible:
                    collapsed: false
                    summary: "{day} — {time}"
                fields:
                  - name: day
                    label: День недели
                    type: select
                    required: true
                    options:
                      values:
                        - name: monday
                          label: Понедельник
                        - name: tuesday
                          label: Вторник
                        - name: wednesday
                          label: Среда
                        - name: thursday
                          label: Четверг
                        - name: friday
                          label: Пятница
                        - name: saturday
                          label: Суббота
                        - name: sunday
                          label: Воскресенье
                  - name: time
                    label: Время
                    type: string
                    required: true
                    description: "Например: 19:00–20:30"
  - name: news
    label: 3. Новости
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: news
        label: Новости на главной странице
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{date} — {title}"
        fields:
          - name: published
            label: Показывать на сайте
            type: boolean
            default: true
          - name: pinned
            label: Закрепить первой
            type: boolean
            default: false
          - name: date
            label: Дата
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: title
            label: Заголовок
            type: string
            required: true
            options:
              maxlength: 120
          - name: text
            label: Текст новости
            type: text
            required: true
            options:
              maxlength: 1000
          - name: image
            label: Фото или видео к новости
            type: file
            options:
              media: photos
              categories:
                - image
                - video
          - name: url
            label: Ссылка «Подробнее»
            type: string
            description: Можно вставить https://... или адрес страницы сайта, например photos.html
          - name: linkLabel
            label: Текст ссылки
            type: string
            default: Подробнее
            options:
              maxlength: 60
          - name: headingStyle
            label: Оформление заголовка
            type: object
            required: false
            default:
              font: site
              size: "24"
              color: "#0b0b0d"
            fields:
              - name: font
                label: Шрифт
                type: select
                default: site
                options:
                  values:
                    - name: site
                      label: Шрифт сайта
                    - name: arial
                      label: Arial
                    - name: georgia
                      label: Georgia — с засечками
                    - name: verdana
                      label: Verdana
                    - name: system
                      label: Системный шрифт
              - name: size
                label: Размер шрифта
                type: select
                default: "24"
                options:
                  values:
                    - name: "14"
                      label: 14 px
                    - name: "16"
                      label: 16 px
                    - name: "18"
                      label: 18 px
                    - name: "20"
                      label: 20 px
                    - name: "22"
                      label: 22 px
                    - name: "24"
                      label: 24 px
                    - name: "28"
                      label: 28 px
                    - name: "32"
                      label: 32 px
                    - name: "36"
                      label: 36 px
                    - name: "40"
                      label: 40 px
                    - name: "48"
                      label: 48 px
                    - name: "56"
                      label: 56 px
              - name: color
                label: Цвет текста
                type: color
                default: "#0b0b0d"
                description: "Нажмите на цвет для выбора. Можно ввести код, например #FFFFFF."
          - name: textStyle
            label: Оформление текста
            type: object
            required: false
            default:
              font: site
              size: "18"
              color: "#0b0b0d"
            fields:
              - name: font
                label: Шрифт
                type: select
                default: site
                options:
                  values:
                    - name: site
                      label: Шрифт сайта
                    - name: arial
                      label: Arial
                    - name: georgia
                      label: Georgia — с засечками
                    - name: verdana
                      label: Verdana
                    - name: system
                      label: Системный шрифт
              - name: size
                label: Размер шрифта
                type: select
                default: "18"
                options:
                  values:
                    - name: "14"
                      label: 14 px
                    - name: "16"
                      label: 16 px
                    - name: "18"
                      label: 18 px
                    - name: "20"
                      label: 20 px
                    - name: "22"
                      label: 22 px
                    - name: "24"
                      label: 24 px
                    - name: "28"
                      label: 28 px
                    - name: "32"
                      label: 32 px
                    - name: "36"
                      label: 36 px
                    - name: "40"
                      label: 40 px
                    - name: "48"
                      label: 48 px
                    - name: "56"
                      label: 56 px
              - name: color

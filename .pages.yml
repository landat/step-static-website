                  label: Rutube
          - name: src
            label: Файл MP4/WebM
            type: file
            description: Заполните для типа «Загруженный MP4/WebM».
            options:
              media: videos
              categories:
                - video
          - name: rutubeUrl
            label: Ссылка на Rutube
            type: string
            description: "Заполните для типа «Rutube»: вставьте обычную ссылку на ролик."
            pattern:
              regex: ^(https://(?:www\.)?rutube\.ru/(?:video|shorts|play/embed)/[^/?#]+[/?#]?.*|)$
              message: Вставьте ссылку на видео с rutube.ru.

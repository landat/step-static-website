# Generated by npm run build:cms from .pages.yml. Do not edit by hand.
backend:
  name: github
  repo: landat/step-static-website
  branch: main
  auth_methods:
    - token
app_title: МЕТЕОР — управление сайтом
site_url: https://landat.github.io/step-static-website/
media_folder: assets/photos
public_folder: /step-static-website/assets/photos
media_libraries:
  default:
    config:
      slugify_filename: true
      max_file_size: 52428800
  stock_assets: false
asset_collections:
  - name: photos
    label: Фотографии
    media_folder: /assets/photos
    public_folder: ./assets/photos
  - name: videos
    label: Видео MP4
    media_folder: /assets/videos
    public_folder: ./assets/videos
  - name: materials
    label: Файлы для учеников
    media_folder: /assets/materials
    public_folder: ./assets/materials
output:
  omit_empty_optional_fields: false
  json:
    indent_size: 2
collections:
  - name: website
    label: Содержимое сайта
    editor:
      preview: false
    files:
      - name: site
        label: Объявление, расписание и другие разделы
        file: content/site.json
        format: json
        fields:
          - name: announcement
            label: 1. Срочное объявление
            widget: object
            required: true
            fields:
              - name: enabled
                label: Показывать объявление
                widget: boolean
                required: false
                default: true
              - name: title
                label: Заголовок
                widget: string
                required: true
                maxlength: 80
              - name: intro
                label: Текст объявления
                widget: text
                required: true
                maxlength: 500
              - name: scheduleTitle
                label: Подпись перед расписанием
                widget: string
                required: true
                maxlength: 120
              - name: directionsLabel
                label: Текст ссылки на схему
                widget: string
                required: true
                maxlength: 60
            collapsed: true
          - name: schedule
            label: 2. Расписание и группы
            widget: object
            required: true
            fields:
              - name: intro
                label: Краткий текст над расписанием
                widget: text
                required: true
                maxlength: 240
              - name: groups
                label: Группы
                widget: list
                required: false
                fields:
                  - name: name
                    label: Название группы
                    widget: string
                    required: true
                    maxlength: 80
                  - name: description
                    label: Для кого эта группа
                    widget: text
                    required: true
                    maxlength: 400
                  - name: sessions
                    label: Дни и время занятий
                    widget: list
                    required: false
                    fields:
                      - name: day
                        label: День недели
                        widget: select
                        required: true
                        options:
                          - value: monday
                            label: Понедельник
                          - value: tuesday
                            label: Вторник
                          - value: wednesday
                            label: Среда
                          - value: thursday
                            label: Четверг
                          - value: friday
                            label: Пятница
                          - value: saturday
                            label: Суббота
                          - value: sunday
                            label: Воскресенье
                      - name: time
                        label: Время
                        widget: string
                        required: true
                        hint: "Например: 19:00–20:30"
                    collapsed: false
                    min: 1
                    summary: "{{day}} — {{time}}"
                collapsed: false
                min: 1
                summary: "{{name}}"
            collapsed: true
          - name: news
            label: 3. Новости
            widget: list
            required: false
            fields:
              - name: published
                label: Показывать на сайте
                widget: boolean
                required: false
                default: true
              - name: pinned
                label: Закрепить первой
                widget: boolean
                required: false
                default: false
              - name: date
                label: Дата
                widget: datetime
                required: true
                type: date
                format: YYYY-MM-DD
                date_format: DD.MM.YYYY
                time_format: false
              - name: title
                label: Заголовок
                widget: string
                required: true
                maxlength: 120
              - name: text
                label: Текст новости
                widget: text
                required: true
                maxlength: 1000
              - name: image
                label: Фотография к новости
                widget: image
                required: false
                media_folder: /assets/photos
                public_folder: ./assets/photos
                accept: .jpg,.jpeg,.png,.webp
                choose_url: false
              - name: url
                label: Ссылка «Подробнее»
                widget: string
                required: false
                hint: Можно вставить https://... или адрес страницы сайта, например photos.html
              - name: linkLabel
                label: Текст ссылки
                widget: string
                required: false
                default: Подробнее
                maxlength: 60
            collapsed: true
            min: 0
            summary: "{{date}} — {{title}}"
          - name: photos
            label: 4. Фотографии
            widget: list
            required: false
            fields:
              - name: published
                label: Показывать на сайте
                widget: boolean
                required: false
                default: true
              - name: src
                label: Файл фотографии
                widget: image
                required: true
                media_folder: /assets/photos
                public_folder: ./assets/photos
                accept: .jpg,.jpeg,.png,.webp
                choose_url: false
              - name: alt
                label: Подпись и краткое описание
                widget: string
                required: true
                hint: Несколько слов о снимке. Эта подпись отображается под фотографией.
                maxlength: 160
            collapsed: true
            min: 0
            summary: "{{alt}}"
          - name: contact
            label: 5. Контакты
            widget: object
            required: true
            fields:
              - name: address
                label: Полный адрес
                widget: text
                required: true
                maxlength: 300
              - name: phone
                label: Телефон
                widget: string
                required: true
                hint: В формате +7 495 123-45-67
                pattern:
                  - ^\+?[0-9 ()-]{10,24}$
                  - Проверьте номер телефона. Разрешены цифры, пробелы, скобки,
                    + и дефисы.
              - name: email
                label: Email
                widget: string
                required: true
                pattern:
                  - ^[^@\s]+@[^@\s]+\.[^@\s]+$
                  - Введите email в формате name@example.ru.
              - name: directions
                label: Как добраться
                widget: text
                required: true
                hint: Абзацы разделяйте пустой строкой.
              - name: mapUrl
                label: Ссылка для карты
                widget: string
                required: true
                hint: Ссылка из атрибута src виджета Яндекс.Карт. Обычно её меняет разработчик.
                pattern:
                  - ^https://yandex\.ru/map-widget/.*$
                  - Нужна ссылка виджета https://yandex.ru/map-widget/...
            collapsed: true
          - name: prices
            label: 6. Цены
            widget: object
            required: true
            fields:
              - name: intro
                label: Вводный текст
                widget: text
                required: true
                maxlength: 300
              - name: items
                label: Варианты занятий
                widget: list
                required: false
                fields:
                  - name: title
                    label: Название
                    widget: string
                    required: true
                    maxlength: 100
                  - name: text
                    label: Описание или стоимость
                    widget: text
                    required: true
                    maxlength: 400
                collapsed: true
                min: 1
                summary: "{{title}}"
              - name: explanationTitle
                label: Заголовок пояснения
                widget: string
                required: true
                maxlength: 120
              - name: explanation
                label: Пояснение
                widget: text
                required: true
                hint: Абзацы разделяйте пустой строкой.
              - name: buttonLabel
                label: Текст кнопки
                widget: string
                required: true
                maxlength: 60
            collapsed: true
          - name: videos
            label: 7. Видео для новичков
            widget: list
            required: false
            fields:
              - name: published
                label: Показывать на сайте
                widget: boolean
                required: false
                default: true
              - name: title
                label: Название урока
                widget: string
                required: true
                maxlength: 140
              - name: description
                label: Краткое описание
                widget: text
                required: false
                maxlength: 500
              - name: kind
                label: Где находится видео
                widget: select
                required: true
                default: mp4
                options:
                  - value: mp4
                    label: Загруженный MP4/WebM
                  - value: rutube
                    label: Rutube
              - name: src
                label: Файл MP4/WebM
                widget: file
                required: false
                hint: Заполните для типа «Загруженный MP4/WebM».
                media_folder: /assets/videos
                public_folder: ./assets/videos
                accept: .mp4,.webm
                choose_url: false
              - name: rutubeUrl
                label: Ссылка на Rutube
                widget: string
                required: false
                hint: "Заполните для типа «Rutube»: вставьте обычную ссылку на ролик."
                pattern:
                  - ^(https://(?:www\.)?rutube\.ru/(?:video|shorts|play/embed)/[^/?#]+[/?#]?.*|)$
                  - Вставьте ссылку на видео с rutube.ru.
            collapsed: true
            min: 0
            summary: "{{title}}"
          - name: beginnerMaterials
            label: 8. Материалы для новичков
            widget: list
            required: false
            fields:
              - name: published
                label: Показывать на сайте
                widget: boolean
                required: false
                default: true
              - name: title
                label: Заголовок
                widget: string
                required: true
                maxlength: 140
              - name: text
                label: Текст материала
                widget: text
                required: true
                hint: Абзацы разделяйте пустой строкой.
              - name: url
                label: Файл для скачивания
                widget: file
                required: false
                media_folder: /assets/materials
                public_folder: ./assets/materials
                accept: .pdf,.doc,.docx
                choose_url: false
              - name: linkText
                label: Текст кнопки
                widget: string
                required: false
                default: Открыть материал
                maxlength: 60
            collapsed: true
            min: 0
            summary: "{{title}}"

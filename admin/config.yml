# Generated by npm run build:cms from .pages.yml. Do not edit by hand.
backend:
  name: github
  repo: landat/step-static-website
  branch: main
  auth_methods:
    - token
app_title: МЕТЕОР — управление сайтом
site_url: https://landat.github.io/step-static-website/
media_folder: assets/photos
public_folder: /step-static-website/assets/photos
media_libraries:
  default:
    config:
      slugify_filename: true
      max_file_size: 52428800
  stock_assets: false
asset_collections:
  - name: photos
    label: Фото и видео
    media_folder: /assets/photos
    public_folder: ./assets/photos
  - name: videos
    label: Видео MP4
    media_folder: /assets/videos
    public_folder: ./assets/videos
  - name: materials
    label: Файлы для учеников
    media_folder: /assets/materials
    public_folder: ./assets/materials
output:
  omit_empty_optional_fields: false
  json:
    indent_size: 2
collections:
  - name: website
    label: Содержимое сайта
    editor:
      preview: false
    files:
      - name: site
        label: Редактировать сайт
        file: content/site.json
        format: json
        fields:
          - name: announcement
            label: Объявление
            widget: object
            required: true
            fields:
              - name: enabled
                label: Показывать объявление
                widget: boolean
                required: false
                default: true
              - name: title
                label: Заголовок
                widget: string
                required: true
                maxlength: 80
              - name: intro
                label: Текст объявления
                widget: text
                required: true
                maxlength: 500
              - name: scheduleTitle
                label: Подпись перед расписанием
                widget: string
                required: true
                maxlength: 120
              - name: directionsLabel
                label: Текст ссылки на схему
                widget: string
                required: true
                maxlength: 60
            collapsed: false
            hint: Измените текст или выключите «Показывать объявление», чтобы временно
              скрыть его.
          - name: schedule
            label: Расписание
            widget: object
            required: true
            fields:
              - name: intro
                label: Краткий текст над расписанием
                widget: text
                required: true
                maxlength: 240
              - name: groups
                label: Группы
                widget: list
                required: false
                fields:
                  - name: name
                    label: Название группы
                    widget: string
                    required: true
                    maxlength: 80
                  - name: description
                    label: Для кого эта группа
                    widget: text
                    required: true
                    maxlength: 400
                  - name: sessions
                    label: Дни и время занятий
                    widget: list
                    required: false
                    fields:
                      - name: day
                        label: День недели
                        widget: select
                        required: true
                        options:
                          - value: monday
                            label: Понедельник
                          - value: tuesday
                            label: Вторник
                          - value: wednesday
                            label: Среда
                          - value: thursday
                            label: Четверг
                          - value: friday
                            label: Пятница
                          - value: saturday
                            label: Суббота
                          - value: sunday
                            label: Воскресенье
                      - name: time
                        label: Время
                        widget: string
                        required: true
                        hint: "Например: 19:00–20:30"
                    collapsed: false
                    label_singular: занятие
                    min: 1
                    summary: "{{day}} — {{time}}"
                collapsed: false
                label_singular: группу
                min: 1
                summary: "{{name}}"
            collapsed: false
            hint: Раскройте нужную группу и измените дни или время занятий.
          - name: news
            label: Новости
            widget: list
            required: false
            fields:
              - name: published
                label: Показывать на сайте
                widget: boolean
                required: false
                default: true
              - name: pinned
                label: Закрепить первой
                widget: boolean
                required: false
                default: false
              - name: date
                label: Дата
                widget: datetime
                required: true
                type: date
                format: YYYY-MM-DD
                date_format: DD.MM.YYYY
                time_format: false
              - name: title
                label: Заголовок
                widget: string
                required: true
                maxlength: 120
              - name: text
                label: Текст новости
                widget: text
                required: true
                maxlength: 1000
              - name: image
                label: Фото или видео к новости
                widget: file
                required: false
                media_folder: /assets/photos
                public_folder: ./assets/photos
                accept: .jpg,.jpeg,.png,.webp,.mp4,.webm
                choose_url: false
              - name: url
                label: Ссылка «Подробнее»
                widget: string
                required: false
                hint: Можно вставить https://... или адрес страницы сайта, например photos.html
              - name: linkLabel
                label: Текст ссылки
                widget: string
                required: false
                default: Подробнее
                maxlength: 60
              - name: headingStyle
                label: Оформление заголовка
                widget: object
                required: false
                default:
                  font: site
                  size: "24"
                  color: "#0b0b0d"
                fields:
                  - name: font
                    label: Шрифт
                    widget: select
                    required: false
                    default: site
                    options:
                      - value: site
                        label: Шрифт сайта
                      - value: arial
                        label: Arial
                      - value: georgia
                        label: Georgia — с засечками
                      - value: verdana
                        label: Verdana
                      - value: system
                        label: Системный шрифт
                  - name: size
                    label: Размер шрифта
                    widget: select
                    required: false
                    default: "24"
                    options:
                      - value: "14"
                        label: 14 px
                      - value: "16"
                        label: 16 px
                      - value: "18"
                        label: 18 px
                      - value: "20"
                        label: 20 px
                      - value: "22"
                        label: 22 px
                      - value: "24"
                        label: 24 px
                      - value: "28"
                        label: 28 px
                      - value: "32"
                        label: 32 px
                      - value: "36"
                        label: 36 px
                      - value: "40"
                        label: 40 px
                      - value: "48"
                        label: 48 px
                      - value: "56"
                        label: 56 px
                  - name: color
                    label: Цвет текста
                    widget: color
                    required: false
                    default: "#0b0b0d"
                    hint: "Нажмите на цвет для выбора. Можно ввести код, например #FFFFFF."
                    allowInput: true
                    enableAlpha: false
                collapsed: true
              - name: textStyle
                label: Оформление текста
                widget: object
                required: false
                default:
                  font: site
                  size: "18"
                  color: "#0b0b0d"
                fields:
                  - name: font
                    label: Шрифт
                    widget: select
                    required: false
                    default: site
                    options:
                      - value: site
                        label: Шрифт сайта
                      - value: arial
                        label: Arial
                      - value: georgia
                        label: Georgia — с засечками
                      - value: verdana
                        label: Verdana
                      - value: system
                        label: Системный шрифт
                  - name: size
                    label: Размер шрифта
                    widget: select
                    required: false
                    default: "18"
                    options:
                      - value: "14"
                        label: 14 px
                      - value: "16"
                        label: 16 px
                      - value: "18"
                        label: 18 px
                      - value: "20"
                        label: 20 px
                      - value: "22"
                        label: 22 px
                      - value: "24"
                        label: 24 px
                      - value: "28"
                        label: 28 px
                      - value: "32"
                        label: 32 px
                      - value: "36"
                        label: 36 px
                      - value: "40"
                        label: 40 px
                      - value: "48"
                        label: 48 px
                      - value: "56"
                        label: 56 px
                  - name: color
                    label: Цвет текста
                    widget: color
                    required: false
                    default: "#0b0b0d"
                    hint: "Нажмите на цвет для выбора. Можно ввести код, например #FFFFFF."
                    allowInput: true
                    enableAlpha: false
                collapsed: true
            collapsed: true
            label_singular: новость
            min: 0
            summary: "{{date}} — {{title}}"
            hint: "Добавьте новость: новые показываются слева, предыдущие — правее. При
              одинаковой дате последняя добавленная будет первой. «Закрепить
              первой» имеет приоритет. Внутри каждой новости есть оформление
              заголовка и текста: шрифт, размер, цвет."
          - name: photos
            label: Фото и видео
            widget: list
            required: false
            fields:
              - name: published
                label: Показывать на сайте
                widget: boolean
                required: false
                default: true
              - name: src
                label: Фото или видео
                widget: file
                required: true
                media_folder: /assets/photos
                public_folder: ./assets/photos
                accept: .jpg,.jpeg,.png,.webp,.mp4,.webm
                choose_url: false
              - name: alt
                label: Подпись и краткое описание
                widget: string
                required: true
                hint: Несколько слов о фото или видео. Подпись отображается в галерее.
                maxlength: 160
            collapsed: true
            label_singular: фото или видео
            min: 0
            summary: "{{alt}}"
            hint: Добавьте фото или видео MP4/WebM, напишите подпись и сохраните. Галочка
              управляет видимостью в галерее. Порядок можно менять
              перетаскиванием.
          - name: contact
            label: Контакты
            widget: object
            required: true
            fields:
              - name: address
                label: Полный адрес
                widget: text
                required: true
                maxlength: 300
              - name: phone
                label: Телефон
                widget: string
                required: true
                hint: В формате +7 495 123-45-67
                pattern:
                  - ^\+?[0-9 ()-]{10,24}$
                  - Проверьте номер телефона. Разрешены цифры, пробелы, скобки,
                    + и дефисы.
              - name: email
                label: Email
                widget: string
                required: true
                pattern:
                  - ^[^@\s]+@[^@\s]+\.[^@\s]+$
                  - Введите email в формате name@example.ru.
              - name: directions
                label: Как добраться
                widget: text
                required: true
                hint: Абзацы разделяйте пустой строкой.
              - name: mapUrl
                label: Ссылка для карты
                widget: string
                required: true
                hint: Ссылка из атрибута src виджета Яндекс.Карт. Обычно её меняет разработчик.
                pattern:
                  - ^https://yandex\.ru/map-widget/.*$
                  - Нужна ссылка виджета https://yandex.ru/map-widget/...
            collapsed: false
            hint: Здесь меняются контактные данные во всех разделах сайта. Ссылку для карты
              обычно меняет разработчик.
          - name: prices
            label: Цены
            widget: object
            required: true
            fields:
              - name: intro
                label: Вводный текст
                widget: text
                required: true
                maxlength: 300
              - name: items
                label: Варианты занятий
                widget: list
                required: false
                fields:
                  - name: title
                    label: Название
                    widget: string
                    required: true
                    maxlength: 100
                  - name: text
                    label: Описание или стоимость
                    widget: text
                    required: true
                    maxlength: 400
                collapsed: true
                label_singular: вариант занятий
                min: 1
                summary: "{{title}}"
              - name: explanationTitle
                label: Заголовок пояснения
                widget: string
                required: true
                maxlength: 120
              - name: explanation
                label: Пояснение
                widget: text
                required: true
                hint: Коротко поясните, как узнать стоимость и записаться. Абзацы разделяйте
                  пустой строкой.
              - name: buttonLabel
                label: Текст кнопки
                widget: string
                required: true
                maxlength: 60
            collapsed: false
            hint: Этот блок показывается на главной странице. Раскройте нужный вариант
              занятий, чтобы изменить описание или стоимость.
          - name: videos
            label: Видеоуроки
            widget: list
            required: false
            fields:
              - name: published
                label: Показывать на сайте
                widget: boolean
                required: false
                default: true
              - name: title
                label: Название урока
                widget: string
                required: true
                maxlength: 140
              - name: description
                label: Краткое описание
                widget: text
                required: false
                maxlength: 500
              - name: kind
                label: Где находится видео
                widget: select
                required: true
                default: mp4
                options:
                  - value: mp4
                    label: Загруженный MP4/WebM
                  - value: rutube
                    label: Rutube
              - name: src
                label: Файл MP4/WebM
                widget: file
                required: false
                hint: Заполните для типа «Загруженный MP4/WebM».
                media_folder: /assets/videos
                public_folder: ./assets/videos
                accept: .mp4,.webm
                choose_url: false
              - name: rutubeUrl
                label: Ссылка на Rutube
                widget: string
                required: false
                hint: "Заполните для типа «Rutube»: вставьте обычную ссылку на ролик."
                pattern:
                  - ^(https://(?:www\.)?rutube\.ru/(?:video|shorts|play/embed)/[^/?#]+[/?#]?.*|)$
                  - Вставьте ссылку на видео с rutube.ru.
            collapsed: true
            label_singular: видеоурок
            min: 0
            summary: "{{title}}"
            hint: "Добавьте урок и выберите источник: файл MP4/WebM или ссылку на Rutube."
          - name: beginnerMaterials
            label: Материалы
            widget: list
            required: false
            fields:
              - name: published
                label: Показывать на сайте
                widget: boolean
                required: false
                default: true
              - name: title
                label: Заголовок
                widget: string
                required: true
                maxlength: 140
              - name: text
                label: Текст материала
                widget: text
                required: true
                hint: Абзацы разделяйте пустой строкой.
              - name: url
                label: Файл для скачивания
                widget: file
                required: false
                media_folder: /assets/materials
                public_folder: ./assets/materials
                accept: .pdf,.doc,.docx
                choose_url: false
              - name: linkText
                label: Текст кнопки
                widget: string
                required: false
                default: Открыть материал
                maxlength: 60
            collapsed: true
            label_singular: материал
            min: 0
            summary: "{{title}}"
            hint: Добавьте текст материала. При необходимости прикрепите файл для
              скачивания.
          - name: about
            label: О нас
            widget: object
            required: true
            fields:
              - name: title
                label: Заголовок
                widget: string
                required: true
                maxlength: 100
              - name: text
                label: Основной текст
                widget: text
                required: true
                hint: Абзацы разделяйте пустой строкой. Возраст приёма — с 11 лет.
                maxlength: 3000
              - name: image
                label: Фото или видео
                widget: file
                required: false
                hint: Выберите фото (JPG, PNG, WebP) или видео (MP4, WebM), до 50 МиБ. Видео
                  запускается по нажатию. Чтобы скрыть медиа, очистите поле.
                media_folder: /assets/photos
                public_folder: ./assets/photos
                accept: .jpg,.jpeg,.png,.webp,.mp4,.webm
                choose_url: false
              - name: imageAlt
                label: Описание фото или видео
                widget: string
                required: false
                maxlength: 160
              - name: audienceHeadingStyle
                label: "Нижний блок: шрифт заголовка «Школа для тех, кто хочет»"
                widget: object
                required: false
                default:
                  font: site
                  size: "36"
                  color: "#ffffff"
                fields:
                  - name: font
                    label: Шрифт
                    widget: select
                    required: false
                    default: site
                    options:
                      - value: site
                        label: Шрифт сайта
                      - value: arial
                        label: Arial
                      - value: georgia
                        label: Georgia — с засечками
                      - value: verdana
                        label: Verdana
                      - value: system
                        label: Системный шрифт
                  - name: size
                    label: Размер шрифта
                    widget: select
                    required: false
                    default: "36"
                    options:
                      - value: "14"
                        label: 14 px
                      - value: "16"
                        label: 16 px
                      - value: "18"
                        label: 18 px
                      - value: "20"
                        label: 20 px
                      - value: "22"
                        label: 22 px
                      - value: "24"
                        label: 24 px
                      - value: "28"
                        label: 28 px
                      - value: "32"
                        label: 32 px
                      - value: "36"
                        label: 36 px
                      - value: "40"
                        label: 40 px
                      - value: "48"
                        label: 48 px
                      - value: "56"
                        label: 56 px
                  - name: color
                    label: Цвет текста
                    widget: color
                    required: false
                    default: "#ffffff"
                    hint: "Нажмите на цвет для выбора. Можно ввести код, например #FFFFFF."
                    allowInput: true
                    enableAlpha: false
                collapsed: true
              - name: invitationStyle
                label: "Нижний блок: шрифт приглашения на бесплатную тренировку"
                widget: object
                required: false
                default:
                  font: site
                  size: "24"
                  color: "#ffffff"
                fields:
                  - name: font
                    label: Шрифт
                    widget: select
                    required: false
                    default: site
                    options:
                      - value: site
                        label: Шрифт сайта
                      - value: arial
                        label: Arial
                      - value: georgia
                        label: Georgia — с засечками
                      - value: verdana
                        label: Verdana
                      - value: system
                        label: Системный шрифт
                  - name: size
                    label: Размер шрифта
                    widget: select
                    required: false
                    default: "24"
                    options:
                      - value: "14"
                        label: 14 px
                      - value: "16"
                        label: 16 px
                      - value: "18"
                        label: 18 px
                      - value: "20"
                        label: 20 px
                      - value: "22"
                        label: 22 px
                      - value: "24"
                        label: 24 px
                      - value: "28"
                        label: 28 px
                      - value: "32"
                        label: 32 px
                      - value: "36"
                        label: 36 px
                      - value: "40"
                        label: 40 px
                      - value: "48"
                        label: 48 px
                      - value: "56"
                        label: 56 px
                  - name: color
                    label: Цвет текста
                    widget: color
                    required: false
                    default: "#ffffff"
                    hint: "Нажмите на цвет для выбора. Можно ввести код, например #FFFFFF."
                    allowInput: true
                    enableAlpha: false
                collapsed: true
            collapsed: false
            hint: "Здесь меняются основной текст, медиа и шрифты нижнего заголовка и
              приглашения. Для изменения самих текстов нижнего блока используйте
              кнопку «О нас: нижний блок» в меню."
          - name: home
            label: Главная
            widget: object
            required: true
            fields:
              - name: heroImage
                label: Фото или видео первого экрана
                widget: file
                required: false
                hint: Горизонтальное фото или видео MP4/WebM, до 50 МиБ. Фон заполняет экран;
                  края могут обрезаться. Видео запускается кнопкой без звука.
                  Пустое поле возвращает исходное фото.
                media_folder: /assets/photos
                public_folder: ./assets/photos
                accept: .jpg,.jpeg,.png,.webp,.mp4,.webm
                choose_url: false
              - name: directionsImage
                label: Фото или видео блока «Основные направления»
                widget: file
                required: false
                hint: Фото или видео MP4/WebM, до 50 МиБ, рядом с карточками направлений. Видео
                  запускается по нажатию. Выберите файл и сохраните. Пустое поле
                  возвращает исходный снимок. Этот блок не связан с галереей.
                media_folder: /assets/photos
                public_folder: ./assets/photos
                accept: .jpg,.jpeg,.png,.webp,.mp4,.webm
                choose_url: false
              - name: preparationHeadingStyle
                label: "Блоки под новостями: шрифт заголовков"
                widget: object
                required: false
                default:
                  font: site
                  size: "36"
                  color: "#ffffff"
                fields:
                  - name: font
                    label: Шрифт
                    widget: select
                    required: false
                    default: site
                    options:
                      - value: site
                        label: Шрифт сайта
                      - value: arial
                        label: Arial
                      - value: georgia
                        label: Georgia — с засечками
                      - value: verdana
                        label: Verdana
                      - value: system
                        label: Системный шрифт
                  - name: size
                    label: Размер шрифта
                    widget: select
                    required: false
                    default: "36"
                    options:
                      - value: "14"
                        label: 14 px
                      - value: "16"
                        label: 16 px
                      - value: "18"
                        label: 18 px
                      - value: "20"
                        label: 20 px
                      - value: "22"
                        label: 22 px
                      - value: "24"
                        label: 24 px
                      - value: "28"
                        label: 28 px
                      - value: "32"
                        label: 32 px
                      - value: "36"
                        label: 36 px
                      - value: "40"
                        label: 40 px
                      - value: "48"
                        label: 48 px
                      - value: "56"
                        label: 56 px
                  - name: color
                    label: Цвет текста
                    widget: color
                    required: false
                    default: "#ffffff"
                    hint: "Нажмите на цвет для выбора. Можно ввести код, например #FFFFFF."
                    allowInput: true
                    enableAlpha: false
                collapsed: true
              - name: preparationTextStyle
                label: "Блоки под новостями: шрифт основного текста"
                widget: object
                required: false
                default:
                  font: site
                  size: "22"
                  color: "#ffffff"
                fields:
                  - name: font
                    label: Шрифт
                    widget: select
                    required: false
                    default: site
                    options:
                      - value: site
                        label: Шрифт сайта
                      - value: arial
                        label: Arial
                      - value: georgia
                        label: Georgia — с засечками
                      - value: verdana
                        label: Verdana
